<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS HUD CYBORG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #030712; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }

  /* Top Bar */
  .top-bar { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .brand { font-size: 1.1rem; font-weight: 900; letter-spacing: 2px; color: #38bdf8; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
  .api-btn { background: #0f172a; border: 1px solid #0284c7; color: #38bdf8; padding: 6px 14px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }

  /* Premium OLED Screen Frame */
  .oled-wrapper {
    width: 100%; max-width: 360px; height: 160px; background: #000;
    border: 3px solid #1e293b; border-radius: 16px; position: relative;
    box-shadow: 0 0 25px rgba(56,189,248,0.25), inset 0 0 15px rgba(0,0,0,0.9);
    padding: 8px 12px; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 12px;
  }
  /* Scanline / Pixel Grid Effect */
  .oled-wrapper::after {
    content: " "; position: absolute; inset: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    background-size: 100% 3px, 3px 100%; pointer-events: none;
  }

  /* OLED HUD Header */
  .oled-hud {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #0f172a; padding-bottom: 4px; font-family: monospace; font-size: 0.75rem; color: #38bdf8;
  }
  .hud-badge { display: flex; align-items: center; gap: 4px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 6px #10b981; }

  /* Eye Animation Stage */
  .eye-stage { flex: 1; display: flex; align-items: center; justify-content: center; gap: 40px; position: relative; }
  .eye {
    width: 36px; height: 48px; background: #38bdf8; border-radius: 18px;
    box-shadow: 0 0 16px #38bdf8, 0 0 30px rgba(56,189,248,0.4);
    transition: all 0.15s ease;
  }
  .eye.blink { height: 3px !important; border-radius: 2px; }
  .eye.happy { border-radius: 50% 50% 15% 15% !important; transform: scaleY(0.7) translateY(4px); }
  .eye.thinking {
    animation: eyeScan 1.1s infinite alternate ease-in-out;
    background: #c084fc; box-shadow: 0 0 20px #c084fc;
  }
  @keyframes eyeScan {
    0% { transform: translateY(-10px) scaleX(1.15); height: 26px; }
    100% { transform: translateY(8px) scaleX(0.85); height: 38px; }
  }

  /* Relays Grid */
  .relays-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 420px; margin-bottom: 12px; }
  .relay-btn {
    background: #090e1a; border: 1px solid #1e293b; border-radius: 10px; padding: 8px 4px;
    text-align: center; font-size: 0.75rem; cursor: pointer; transition: 0.2s;
  }
  .relay-btn.on { background: #064e3b; border-color: #10b981; box-shadow: 0 0 12px rgba(16,185,129,0.3); }
  .relay-icon { font-size: 1.1rem; display: block; margin-bottom: 2px; }
  .relay-stat { font-weight: bold; color: #ef4444; font-size: 0.7rem; }
  .relay-btn.on .relay-stat { color: #10b981; }

  /* Chat Logs */
  .chat-box {
    width: 100%; max-width: 420px; flex: 1; background: #090d16; border-radius: 14px;
    border: 1px solid #1e293b; padding: 12px; overflow-y: auto; max-height: 220px; margin-bottom: 12px;
    display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem;
  }
  .msg { padding: 8px 12px; border-radius: 12px; max-width: 84%; line-height: 1.35; }
  .user-msg { background: #0284c7; align-self: flex-end; color: #fff; border-bottom-right-radius: 2px; }
  .bot-msg { background: #1e293b; align-self: flex-start; color: #e2e8f0; border-bottom-left-radius: 2px; border: 1px solid #334155; }
  .err-msg { background: #450a0a; color: #fca5a5; border: 1px solid #991b1b; }

  /* Input Controls */
  .input-bar { width: 100%; max-width: 420px; display: flex; gap: 8px; align-items: center; }
  .input-field {
    flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 24px;
    padding: 10px 18px; color: #fff; outline: none; font-size: 0.9rem;
  }
  .input-field:focus { border-color: #38bdf8; }
  .action-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none; background: #0284c7;
    color: white; font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: 0.2s;
  }
  .mic-active { background: #ef4444; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand">⚡ JARVIS CORE</div>
  <button class="api-btn" onclick="setupApiKey()">⚙️ Groq Key</button>
</div>

<!-- Holographic OLED Display -->
<div class="oled-wrapper">
  <div class="oled-hud">
    <div class="hud-badge"><span class="dot"></span> ONLINE</div>
    <span id="hudDate">--/--</span>
    <span id="hudClock">00:00:00</span>
  </div>
  <div class="eye-stage">
    <div class="eye" id="lEye"></div>
    <div class="eye" id="rEye"></div>
  </div>
</div>

<!-- 4 Hardware Relays -->
<div class="relays-container">
  <div class="relay-btn" id="r_light" onclick="manualToggle('light')"><span class="relay-icon">💡</span>Light<br><span class="relay-stat" id="s_light">OFF</span></div>
  <div class="relay-btn" id="r_fan" onclick="manualToggle('fan')"><span class="relay-icon">🌀</span>Fan<br><span class="relay-stat" id="s_fan">OFF</span></div>
  <div class="relay-btn" id="r_tv" onclick="manualToggle('tv')"><span class="relay-icon">📺</span>TV<br><span class="relay-stat" id="s_tv">OFF</span></div>
  <div class="relay-btn" id="r_plug" onclick="manualToggle('plug')"><span class="relay-icon">🔌</span>Plug<br><span class="relay-stat" id="s_plug">OFF</span></div>
</div>

<!-- Live Chat Panel -->
<div class="chat-box" id="chatBox">
  <div class="msg bot-msg">सिस्टम ऑनलाइन है संगम भाई! आप बोलें, टाइप करें या टूटी-फूटी हिंग्लिश में कुछ भी कहें, मैं रेडी हूँ।</div>
</div>

<!-- Text & Mic Inputs -->
<div class="input-bar">
  <input type="text" class="input-field" id="textInput" placeholder="लिखें (उदा: pankha chala do ya kya hal hai)..." onkeydown="if(event.key==='Enter') sendText()">
  <button class="action-btn" id="sendBtn" onclick="sendText()">➤</button>
  <button class="action-btn" id="micBtn" onclick="toggleMic()">🎤</button>
</div>

<script>
  let GROQ_KEY = localStorage.getItem('jarvis_groq_key') || '';
  const ACTIVE_MODEL = "openai/gpt-oss-20b"; 

  const chatBox = document.getElementById('chatBox');
  const textInput = document.getElementById('textInput');
  const micBtn = document.getElementById('micBtn');
  const lEye = document.getElementById('lEye');
  const rEye = document.getElementById('rEye');

  const relays = {
    light: { el: document.getElementById('r_light'), stat: document.getElementById('s_light'), on: false },
    fan:   { el: document.getElementById('r_fan'),   stat: document.getElementById('s_fan'),   on: false },
    tv:    { el: document.getElementById('r_tv'),    stat: document.getElementById('s_tv'),    on: false },
    plug:  { el: document.getElementById('r_plug'),  stat: document.getElementById('s_plug'),  on: false }
  };

  // Real-Time HUD Clock
  function updateHUDClock() {
    const now = new Date();
    document.getElementById('hudClock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    document.getElementById('hudDate').innerText = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
  }
  setInterval(updateHUDClock, 1000);
  updateHUDClock();

  // Eye Animation Functions
  function triggerBlink() {
    if (lEye.classList.contains('thinking')) return;
    lEye.classList.add('blink'); rEye.classList.add('blink');
    setTimeout(() => { lEye.classList.remove('blink'); rEye.classList.remove('blink'); }, 180);
  }
  setInterval(triggerBlink, 3800);

  function setMood(mood) {
    lEye.className = 'eye'; rEye.className = 'eye';
    if(mood === 'happy') { lEye.classList.add('happy'); rEye.classList.add('happy'); }
    if(mood === 'thinking') { lEye.classList.add('thinking'); rEye.classList.add('thinking'); }
  }

  function setupApiKey() {
    const key = prompt("अपनी Groq API Key यहाँ पेस्ट करें:", GROQ_KEY);
    if (key !== null) {
      GROQ_KEY = key.trim();
      localStorage.setItem('jarvis_groq_key', GROQ_KEY);
      appendMsg('bot', "Groq API Key सफलता से सेव कर ली गई है!");
    }
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'hi-IN';
    utt.rate = 1.05;
    utt.onstart = () => setMood('happy');
    utt.onend = () => setMood('normal');
    window.speechSynthesis.speak(utt);
  }

  function appendMsg(sender, text, isError = false) {
    const div = document.createElement('div');
    div.className = `msg ${sender}-msg ${isError ? 'err-msg' : ''}`;
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function toggleRelay(key, state) {
    relays[key].on = state;
    if(state) {
      relays[key].el.classList.add('on');
      relays[key].stat.innerText = 'ON';
    } else {
      relays[key].el.classList.remove('on');
      relays[key].stat.innerText = 'OFF';
    }
  }

  function manualToggle(key) {
    toggleRelay(key, !relays[key].on);
  }

  // Unified Smart Processor
  async function processInput(rawText) {
    appendMsg('user', rawText);
    const txt = rawText.toLowerCase().trim();
    setMood('thinking');

    const isOff = txt.includes('off') || txt.includes('band') || txt.includes('bnd') || txt.includes('rok') || txt.includes('bujha') || txt.includes('बंद');
    const isOn = txt.includes('on') || txt.includes('chalu') || txt.includes('chla') || txt.includes('jala') || txt.includes('चालू') || txt.includes('चला');
    let handled = false;
    let reply = "";

    // 1. Hardware Commands Handling
    if (txt.includes('light') || txt.includes('bulb') || txt.includes('roshni') || txt.includes('लाइट')) {
      toggleRelay('light', !isOff);
      reply = !isOff ? "लाइट चालू कर दी है संगम भाई।" : "लाइट बंद कर दी गई है।";
      handled = true;
    }
    else if (txt.includes('fan') || txt.includes('pankha') || txt.includes('hawa') || txt.includes('पंखा')) {
      toggleRelay('fan', !isOff);
      reply = !isOff ? "पंखा ऑन कर दिया है।" : "पंखा बंद कर दिया है।";
      handled = true;
    }
    else if (txt.includes('tv') || txt.includes('screen') || txt.includes('टीव')) {
      toggleRelay('tv', !isOff);
      reply = !isOff ? "टीवी ऑन कर दिया है।" : "टीवी ऑफ कर दिया गया है।";
      handled = true;
    }
    else if (txt.includes('plug') || txt.includes('socket') || txt.includes('प्लमर') || txt.includes('प्लग')) {
      toggleRelay('plug', !isOff);
      reply = !isOff ? "सॉकेट प्लग ऑन कर दिया है।" : "सॉकेट प्लग बंद कर दिया है।";
      handled = true;
    }
    else if (txt.includes('all on') || txt.includes('sab on') || txt.includes('sb on') || txt.includes('सब ऑन')) {
      Object.keys(relays).forEach(k => toggleRelay(k, true));
      reply = "कमरे के सारे डिवाइसेज ऑन कर दिए हैं!";
      handled = true;
    }
    else if (txt.includes('all off') || txt.includes('sab band') || txt.includes('sb band') || txt.includes('सब बंद')) {
      Object.keys(relays).forEach(k => toggleRelay(k, false));
      reply = "सारे डिवाइसेज बंद कर दिए गए हैं।";
      handled = true;
    }

    // 2. Offline Smart Chit-Chat Handling
    else if (txt.includes('kaun ho') || txt.includes('who are you') || txt.includes('कौन हो')) {
      reply = "मैं आपका पर्सनल स्मार्ट AI जार्विस हूँ संगम भाई, आपका कमरा कंट्रोल करने के लिए हमेशा तैयार!";
      handled = true;
    }
    else if (txt.includes('kya haal') || txt.includes('kaise ho') || txt.includes('kaisa hai') || txt.includes('कैसे हो')) {
      reply = "मैं एकदम बढ़िया और सुपरफास्ट हूँ भाई! आप बताइए आज क्या प्लान है?";
      handled = true;
    }

    if (handled) {
      setMood('normal');
      appendMsg('bot', reply);
      speak(reply);
      return;
    }

    // 3. General Queries via Groq API
    if (GROQ_KEY) {
      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: ACTIVE_MODEL,
            messages: [
              { 
                role: "system", 
                content: "You are JARVIS, an authentic, witty, loyal AI companion created by Sangam. Speak in natural conversational Hindi or Hinglish. Answer in exactly 1 or 2 crisp sentences." 
              },
              { role: "user", content: rawText }
            ],
            max_tokens: 75
          })
        });

        const data = await response.json();
        setMood('normal');

        if (data.error) {
          reply = `API एरर: ${data.error.message}`;
          appendMsg('bot', reply, true);
          speak("एपीआई में कोई दिक्कत है भाई, चैट चेक करें।");
        } else {
          reply = data.choices?.[0]?.message?.content || "हाँ भाई, सुन रहा हूँ।";
          appendMsg('bot', reply);
          speak(reply);
        }
      } catch (err) {
        setMood('normal');
        reply = "नेटवर्क में दिक्कत आ रही है भाई, लेकिन सिस्टम के स्विच काम कर रहे हैं।";
        appendMsg('bot', reply, true);
        speak(reply);
      }
    } else {
      setMood('normal');
      reply = "कमांड दर्ज कर ली गई है संगम भाई। ओपन-एंडेड सवालों के लिए ऊपर ⚙️ Groq Key जोड़ लें।";
      appendMsg('bot', reply);
      speak(reply);
    }
  }

  function sendText() {
    const val = textInput.value.trim();
    if (!val) return;
    textInput.value = '';
    processInput(val);
  }

  // Speech Recognition
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer;
  if (SpeechRec) {
    recognizer = new SpeechRec();
    recognizer.lang = 'hi-IN';
    recognizer.onstart = () => micBtn.classList.add('mic-active');
    recognizer.onend = () => micBtn.classList.remove('mic-active');
    recognizer.onresult = (e) => processInput(e.results[0][0].transcript);
  }

  function toggleMic() {
    if (!recognizer) { alert('माइक के लिए Chrome ब्राउज़र इस्तेमाल करें!'); return; }
    try { recognizer.start(); } catch(e) { recognizer.stop(); }
  }
</script>
</body>
</html>
